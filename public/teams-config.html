<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Konfigurace – Katalog OOPP</title>
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 28px 32px; background: #f3f2f1; color: #333; }
    h2 { color: #003f7a; margin-bottom: 8px; font-size: 1.2em; }
    p  { color: #555; font-size: .92em; margin-bottom: 18px; }
    .btn {
      background: #007BC2; color: #fff; border: none; padding: 10px 22px;
      border-radius: 6px; font-size: .95em; cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: #005fa3; }
  </style>
</head>
<body>
  <h2>📋 Katalog OOPP – konfigurace záložky</h2>
  <p>Záložka zobrazí celý katalog osobních ochranných pracovních prostředků Engel-Gematex s.r.o.</p>
  <p>Žádné další nastavení není potřeba — klikněte na <strong>Uložit</strong> v Teams.</p>

  <script>
    microsoftTeams.app.initialize().then(() => {
      microsoftTeams.pages.config.registerOnSaveHandler(function(saveEvent) {
        microsoftTeams.pages.config.setConfig({
          entityId: 'katalogOOPP',
          contentUrl: 'https://oopp.vojcik.net/teams.html',
          websiteUrl: 'https://oopp.vojcik.net/',
          suggestedDisplayName: 'Katalog OOPP'
        });
        saveEvent.notifySuccess();
      });
      microsoftTeams.pages.config.setValidityState(true);
    });
  </script>
</body>
</html>
